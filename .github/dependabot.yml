# Dependabot keeps Aeon's dependencies current and auditable.
# Aeon runs autonomous code with access to operator secrets and executes
# community-pack skills on a cron, so silent npm vulns and mutable-tag action
# hijacks are a real risk.
#
# Noise control (Aeon is a template — a clean Actions tab matters):
#   - grouped: each ecosystem opens ONE combined PR per cycle, not one-per-dep.
#     Fewer PRs => fewer merges => fewer re-scan cascades (every push to main
#     makes Dependabot re-evaluate all ecosystems, which is what spammed the tab).
#   - monthly: a template doesn't need weekly version churn.
#   - real CVEs are handled out-of-band by Dependabot *security* updates
#     (repo Settings -> Code security), which only fire on an actual advisory.
version: 2
updates:
  # GitHub Actions across all workflow files (currently floating @v4/@v5 tags).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    assignees:
      - "aeonfun"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Next.js dashboard — the largest npm surface (Next 16, React 19, tailwind).
  - package-ecosystem: "npm"
    directory: "/apps/dashboard"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    assignees:
      - "aeonfun"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      dashboard:
        patterns:
          - "*"
    # Hold TypeScript on the 6.x line. TS 7 (the native/Go port) ships a different
    # package layout that Next.js 16's build-time TS integration doesn't recognize
    # yet: `next build` crashes ("The 'id' argument must be of type string") even
    # though `tsc --noEmit` passes. Minor/patch bumps within 6.x still flow through.
    # Revisit once Next.js ships TS7 support.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint 10 crashes eslint-config-next's bundled eslint-plugin-react at
      # runtime (peer allows >=9 but the plugin throws). Hold on 9.x until
      # eslint-config-next supports eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # OpenTelemetry 3.x moves as one family: @opentelemetry/api 1.10 pairs with
      # the 3.x SDK, and @vercel/otel 2.x (plus every 2.x SDK package) only accepts
      # api <1.10, so a lone api bump fails npm install. Hold until @vercel/otel
      # supports the 3.x SDK, then bump the whole family by hand.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]

  # MCP server — exposes Aeon skills as Claude tools.
  - package-ecosystem: "npm"
    directory: "/apps/mcp-server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    assignees:
      - "aeonfun"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      mcp-server:
        patterns:
          - "*"
    # OpenTelemetry 3.x moves as one family (see the dashboard note): hold api 1.10,
    # the 3.x SDK packages and the matching 0.300 exporter until all of them, and
    # the dashboard's @vercel/otel, can move together in one hand-made bump.
    ignore:
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/exporter-trace-otlp-proto"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/resources"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/sdk-trace-base"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/sdk-trace-node"
        update-types: ["version-update:semver-major"]

  # CLI — non-interactive control of an Aeon repo; shares apps/dashboard/lib.
  - package-ecosystem: "npm"
    directory: "/apps/cli"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    assignees:
      - "aeonfun"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      cli:
        patterns:
          - "*"

  # Cloudflare Worker that relays Telegram messages to a fork.
  - package-ecosystem: "npm"
    directory: "/apps/webhook"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    assignees:
      - "aeonfun"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      webhook:
        patterns:
          - "*"
    # eslint 10 and globals 17 are breaking majors that fail the webhook lint/bundle
    # step (ESM resolution error under the flat-config migration). Hold both on their
    # current majors so the grouped PR stays green; revisit when the worker's eslint
    # setup supports 10.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
      # OpenTelemetry 3.x moves as one family (see the dashboard note).
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
