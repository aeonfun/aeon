name: ci-apps

# apps/** was the largest untested surface in the repo: four shipped apps — the
# Next.js dashboard, the CLI, the MCP server, and the Telegram Worker — with no
# gate of any kind. The dashboard alone carries a committed unit-test suite
# (apps/dashboard/lib/**/*.test.{ts,mjs}) that nothing ran, plus a strict-mode
# TypeScript config nothing typechecked.
#
# That gap is not theoretical. Dependabot opens grouped monthly npm PRs against
# apps/dashboard, apps/mcp-server, and apps/webhook (.github/dependabot.yml) —
# every one of them landed with zero automated verification that the app still
# compiles. The TypeScript-7 pin comment in dependabot.yml records a breakage
# caught by hand: `next build` crashed while `tsc --noEmit` passed. That is why
# the dashboard job runs BOTH — a typecheck alone would have missed it.
#
# One job per app (the CLI rides in the dashboard job, which it borrows its
# toolchain from) so a red X names the broken surface, and so a slow dashboard
# build never masks a fast Worker failure. The workflow-level path filter is
# `apps/**` rather than per-job filters: keeping it native (no third-party
# paths-filter action) is worth re-running a 30-second Worker job on a
# dashboard-only PR.
#
# No secrets, no network beyond the registry: `next build` is fully static here
# (every route is dynamic/server-rendered at request time) and `wrangler
# --dry-run` bundles the Worker without touching a Cloudflare account, so this
# workflow runs green on fork PRs.
#
# Run locally: see each app's README, or the same commands used below.

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'biome.json'
      - '.github/workflows/ci-apps.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'biome.json'
  workflow_dispatch:

permissions:
  contents: read

# A force-push mid-review shouldn't leave a stale build burning a runner. Never
# cancels main, so every merged commit keeps a complete result.
concurrency:
  group: ci-apps-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    timeout-minutes: 2
    name: format - biome
    # A ~10s check: GitHub's runner on purpose, not AEON_RUNNER (free on public
    # repos, starts faster, a bigger runner does not help).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # Formatter only (linting stays with each app's eslint). One root biome.json
      # covers all four apps, with per-app quote/semicolon overrides that keep each
      # app's existing style. Pinned exact so a Biome release can't reformat the
      # tree under an unrelated PR. Fix locally with `npm run format`.
      - name: Format check (biome ci)
        run: npx --yes @biomejs/biome@2.5.15 ci --reporter=github .

  dashboard:
    timeout-minutes: 3
    name: dashboard — typecheck, test, build
    runs-on: ${{ vars.AEON_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node 24, not 22: the unit tests run in random order (see the test step),
      # and node --test only shuffles on 24.16+. Nothing here ships on Node 22:
      # the dashboard runs on the operator's own Node, so 22 was just the
      # default every job copied.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/dashboard/package-lock.json
            apps/cli/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      # eslint-config-next flat config (Next 16 removed `next lint`). Fails only
      # on error-severity rules; the new react-hooks v6 rules are warnings so the
      # gate is green on the existing tree (see apps/dashboard/eslint.config.mjs).
      - name: Lint (eslint)
        run: npm run lint
      # Random order, so a test that leans on another one's leftovers fails here
      # instead of hiding. The log prints "Randomized test order seed: N"; replay
      # a red run locally on Node 24 with
      # NODE_OPTIONS='--test-randomize --test-random-seed=N' npm test
      - name: Unit tests (random order)
        run: npm test
        env:
          NODE_OPTIONS: --test-randomize
      # Kept separate from the typecheck on purpose — see the TS7 note above.
      - name: Production build
        run: npm run build
      # The CLI steps live here, not in their own job: the CLI shares one source
      # of truth with the dashboard (its tsconfig compiles ../dashboard/lib/**/*.ts
      # and borrows that app's typescript, @types and eslint via
      # apps/cli/tsconfig.json `typeRoots`), so it needs the dashboard
      # node_modules installed above. A separate job paid for a second
      # dashboard npm ci. Step names still say "CLI" so a red X names it.
      - name: Install CLI deps
        run: npm ci
        working-directory: apps/cli
      - name: CLI typecheck (strict, includes the shared dashboard lib)
        run: npm run typecheck
        working-directory: apps/cli
      - name: CLI lint (eslint, borrows the dashboard install)
        run: npm run lint
        working-directory: apps/cli
      # `aeon init` end to end against a fake gh (a directory of bare repos):
      # template switch-over, re-run, resume, --dir, refusals. No network.
      - name: CLI aeon init sandbox tests
        run: bash apps/cli/test/init-sandbox.sh
        working-directory: .

  mcp-server:
    timeout-minutes: 2
    name: mcp-server — build
    # A ~10s check: GitHub's runner on purpose, not AEON_RUNNER (free on public
    # repos, starts faster, a bigger runner does not help).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node 24 for the random-order tests below (node --test shuffles on
      # 24.16+). The package declares engines node >=18, so 24 is in range.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mcp-server/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      # `npm run build` (tsc, emitting to dist/) rather than a bare --noEmit:
      # dist/index.js is this package's published `bin`, so a build that cannot
      # emit is a broken install for anyone running `aeon-mcp`.
      - name: Build
        run: npm run build
      # Hermetic (temp repo root, fake run-harness, no network): the var is
      # cleaned once and the same value reaches the capability check, the
      # prompt and the log, so a padded shadow selector still runs read-only.
      # Random order; the seed is printed, replay as in the dashboard job.
      - name: Unit tests (random order)
        run: npm test
        env:
          NODE_OPTIONS: --test-randomize

  webhook:
    timeout-minutes: 2
    name: webhook — worker bundle
    # A ~10s check: GitHub's runner on purpose, not AEON_RUNNER (free on public
    # repos, starts faster, a bigger runner does not help).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/webhook
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/webhook/package-lock.json
      - name: Syntax check the Worker
        run: node --check src/worker.js
      - name: Install deps
        run: npm ci --no-audit --no-fund
      # Plain-JS Worker: @eslint/js recommended with Worker runtime globals
      # declared (see apps/webhook/eslint.config.mjs).
      - name: Lint (eslint)
        run: npm run lint
      # Replay-guard unit tests (test/replay-guard.test.mjs): hermetic, a stubbed
      # fetch + in-memory KV, no Cloudflare or GitHub calls.
      - name: Unit tests
        run: npm test
      # --dry-run validates wrangler.toml and bundles the Worker without any
      # Cloudflare credentials, so a broken config or a bad import fails here
      # instead of at deploy time.
      - name: Bundle (wrangler --dry-run, no credentials needed)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
