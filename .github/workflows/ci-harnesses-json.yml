name: ci-harnesses-json

# harness-adapter/harnesses.json is the capability manifest for the nine adapters -
# the local analog of a UHP GET /v1/harnesses discovery response. It is generated
# from each adapters/<h>.sh rh-meta block by
# harness-adapter/bin/generate-harnesses-json. This workflow fails any PR that
# edits a generator input without committing the regenerated manifest, so the
# manifest cannot drift from the adapters it describes. The same generator writes
# harness-adapter/gateways.json (the claude gateway cascade, from the gw-meta
# block in adapters/claude.sh), so it is diffed the same way.
#
# Same shape as ci-skills-json.yml. There are no git-derived fields here, so only
# the `generated` timestamp is normalized out of the diff.

on:
  pull_request:
    paths:
      - 'harness-adapter/adapters/**'
      - 'harness-adapter/bin/generate-harnesses-json'
      - 'harness-adapter/harnesses.json'
      - 'harness-adapter/gateways.json'
      - '.github/workflows/ci-harnesses-json.yml'
  push:
    branches: [main]
    paths:
      - 'harness-adapter/adapters/**'
      - 'harness-adapter/bin/generate-harnesses-json'
      - 'harness-adapter/harnesses.json'
      - 'harness-adapter/gateways.json'
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded in-progress run when a newer commit is pushed to the same PR
# (reclaims runner-minutes on stacked PR pushes). Never cancels push/main/tag runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Regenerate harnesses.json + gateways.json and diff (ignoring generated timestamp)
        run: |
          set -euo pipefail
          norm() { sed -E 's/"generated": *"[^"]*"/"generated":""/' "$1"; }
          norm harness-adapter/harnesses.json > /tmp/hn.committed.json
          norm harness-adapter/gateways.json > /tmp/gw.committed.json
          harness-adapter/bin/generate-harnesses-json
          norm harness-adapter/harnesses.json > /tmp/hn.regenerated.json
          norm harness-adapter/gateways.json > /tmp/gw.regenerated.json
          stale=0
          diff -u /tmp/hn.committed.json /tmp/hn.regenerated.json || stale=1
          diff -u /tmp/gw.committed.json /tmp/gw.regenerated.json || stale=1
          if [ "$stale" = 1 ]; then
            echo "::error::harnesses.json or gateways.json is stale - run harness-adapter/bin/generate-harnesses-json and commit the result (the 'generated' timestamp is ignored)."
            exit 1
          fi
          echo "harnesses-json: OK - committed manifests match a fresh regen (generated timestamp aside)."
